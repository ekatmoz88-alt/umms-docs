name: Deploy public UMMS documentation
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "01_API_ПУБЛИЧНАЯ.md"
      - "02_Клиент_ПУБЛИЧНАЯ.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public-only website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp 01_API_ПУБЛИЧНАЯ.md _site/
          cp 02_Клиент_ПУБЛИЧНАЯ.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
